services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    environment:
      APP_HOST: ${APP_HOST:?APP_HOST is required}
      API_HOST: ${API_HOST:?API_HOST is required}
      AUTH_HOST: ${AUTH_HOST:?AUTH_HOST is required}
      OBJECTS_HOST: ${OBJECTS_HOST:?OBJECTS_HOST is required}
      NGINX_ENVSUBST_FILTER: "^(APP_HOST|API_HOST|AUTH_HOST|OBJECTS_HOST)$$"
    volumes:
      - ./infra/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["80:80", "443:443"]
    networks: [edge, app]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000"]
    networks: [data, edge]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    command: start --health-enabled=true --proxy-headers=xforwarded --hostname-strict=true
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN is required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME is required}
      KC_HTTP_ENABLED: "true"
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["127.0.0.1:${KEYCLOAK_PORT:-8280}:8080"]
    networks: [data, edge]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
  migrate:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    command: ["./node_modules/.bin/prisma", "migrate", "deploy", "--schema", "apps/api/prisma/schema.prisma"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    restart: "no"
    security_opt: [no-new-privileges:true]
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    ports: ["127.0.0.1:${API_PORT:-3301}:3001"]
    networks: [data, app]
  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [data]
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    env_file: ${PRODUCTION_ENV_FILE:-.env.production}
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    networks: [app, edge]
networks:
  edge:
  app: { internal: true }
  data: { internal: true }
volumes:
  postgres_data:
  redis_data:
  minio_data:
